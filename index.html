<!DOCTYPE html>
<html>
<head>
    <title>Shutter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #111;
            color: white;
            font-family: Arial;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 8%;
            flex-wrap: wrap;
            gap: 20px;
        }

        nav a {
            color: #aaa;
            text-decoration: none;
            margin-left: 20px;
        }

        nav a:hover, .active {
            color: white;
        }

        .logo {
            color: white;
            font-size: 25px;
        }

        h1 {
            text-align: center;
            margin: 50px 0 30px;
            letter-spacing: 4px;
        }

        .photo {
            position: relative;
            overflow: hidden;
        }

        .photo img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            transition: 0.4s;
        }

        .photo:hover img {
            transform: scale(1.08);
            opacity: 0.6;
        }

        .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            font-size: 22px;
            transition: 0.4s;
        }

        .photo:hover .overlay {
            opacity: 1;
        }

        section {
            text-align: center;
            padding: 70px 15px;
            color: #aaa;
        }

        footer {
            text-align: center;
            color: #777;
            padding: 30px;
        }

        @media(max-width: 600px) {
            nav {
                flex-direction: column;
            }

            nav a {
                margin: 5px;
            }

            .photo img {
                height: 220px;
            }
        }
    </style>
</head>
<body>

<nav>
    <a href="index.html" class="logo">SHUTTER</a>
    <div>
        <a href="index.html" class="active">HOME</a>
        <a href="#photos">PHOTOS</a>
        <a href="#bio">BIO</a>
        <a href="contact.html">CONTACT</a>
    </div>
</nav>

<h1>MY PHOTOGRAPHY</h1>

<div class="container-fluid" id="photos">
    <div class="row g-2">

        <div class="col-md-4 col-sm-6">
            <div class="photo">
                <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=700" alt="Landscape">
                <div class="overlay">Nature</div>
            </div>
        </div>

        <div class="col-md-4 col-sm-6">
            <div class="photo">
                <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=700" alt="Nature">
                <div class="overlay">Adventure</div>
            </div>
        </div>

        <div class="col-md-4 col-sm-6">
            <div class="photo">
                <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=700" alt="Sunrise">
                <div class="overlay">Sunrise</div>
            </div>
        </div>

        <div class="col-md-4 col-sm-6">
            <div class="photo">
                <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=700" alt="Mountains">
                <div class="overlay">Mountains</div>
            </div>
        </div>

        <div class="col-md-4 col-sm-6">
            <div class="photo">
                <img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=700" alt="Ocean">
                <div class="overlay">Ocean</div>
            </div>
        </div>

        <div class="col-md-4 col-sm-6">
            <div class="photo">
                <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=700" alt="Forest">
                <div class="overlay">Forest</div>
            </div>
        </div>

    </div>
</div>

<section id="bio">
    <h2>About My Photography</h2>
    <p>Capturing beautiful moments and the world around us.</p>
</section>

<footer>Copyright © 2026 Shutter</footer>

</body>
  </html>
