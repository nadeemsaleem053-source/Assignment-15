<!DOCTYPE html>
<html>
<head>
    <title>Contact - Shutter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #111;
            color: white;
            font-family: Arial;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 8%;
            flex-wrap: wrap;
            gap: 20px;
        }

        nav a {
            color: #aaa;
            text-decoration: none;
            margin-left: 20px;
        }

        nav a:hover, .active {
            color: white;
        }

        .logo {
            color: white;
            font-size: 25px;
        }

        h1 {
            text-align: center;
            margin: 60px 0 25px;
            letter-spacing: 4px;
        }

        .intro {
            text-align: center;
            color: #aaa;
            margin-bottom: 30px;
        }

        input, textarea {
            width: 100%;
            padding: 14px;
            margin-bottom: 18px;
            background: transparent;
            border: 1px solid #444;
            color: white;
        }

        textarea {
            height: 160px;
        }

        button {
            padding: 14px 24px;
            background: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #ccc;
        }

        footer {
            text-align: center;
            color: #777;
            padding: 30px;
            margin-top: 40px;
        }

        @media(max-width: 600px) {
            nav {
                flex-direction: column;
            }

            nav a {
                margin: 5px;
            }
        }
    </style>
</head>
<body>

<nav>
    <a href="index.html" class="logo">SHUTTER</a>
    <div>
        <a href="index.html">HOME</a>
        <a href="index.html#photos">PHOTOS</a>
        <a href="index.html#bio">BIO</a>
        <a href="contact.html" class="active">CONTACT</a>
    </div>
</nav>

<h1>CONTACT ME</h1>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-7">

            <p class="intro">Have a question or want to work together?</p>

            <form>
                <input type="text" placeholder="Your Name" required>
                <input type="email" placeholder="Your Email" required>
                <input type="text" placeholder="Subject" required>
                <textarea placeholder="Write your message..." required></textarea>
                <button type="submit">SEND MESSAGE</button>
            </form>

        </div>
    </div>
</div>

<footer>Copyright © 2026 Shutter</footer>

</body>
  </html>
